        working-directory: android-project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk ZiGoBox-Remote.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiGoBox-Remote-APK
          path: ZiGoBox-Remote.apk
          if-no-files-found: error
